Ready tasks → specloom-worker (≤10) → specloom-worker-validation (≥99)
→ specloom-validator → specloom-standardized-loop (≤3, ≥99)
→ specloom-tester → specloom-test-loop (≤5, 100% coverage)
→ specloom-update-knowledgebase

## Sub-agents

specloom-worker, specloom-worker-validation, specloom-validator, specloom-standardized-loop,
specloom-tester, specloom-test-loop, specloom-update-knowledgebase,
specloom-frontend/backend/database-developer, specloom-*-validator, specloom-*-test-standards

Never read skills directly. Task-delegate sub-agents only.
'''

